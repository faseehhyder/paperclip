services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD: "${PAPERCLIP_DB_ADMIN_PASSWORD:?Set a separate database admin password in Coolify}"
      PAPERCLIP_DB_PASSWORD: "${PAPERCLIP_DB_PASSWORD:?Set a hex database password in Coolify}"
    volumes:
      - paperclip_postgres_data:/var/lib/postgresql/data
      - ./paperclip-postgres-init.sh:/docker-entrypoint-initdb.d/10-paperclip.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 30

  paperclip:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    pids_limit: 2048
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://paperclip:${PAPERCLIP_DB_PASSWORD:?Set a hex database password in Coolify}@db:5432/paperclip"
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      PAPERCLIP_MIGRATION_PROMPT: "never"
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3100"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:?Set the public HTTPS URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set a random session secret}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?Set a separate random signing secret}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    expose:
      - "3100"
    volumes:
      - paperclip_data:/paperclip
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  paperclip_data:
  paperclip_postgres_data:
